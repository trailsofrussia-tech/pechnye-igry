<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Печь в жизни крестьянина — интерактивный день (офлайн)</title>
  <style>
    :root{
      --bg:#0f1115;
      --fg:#e8e8ea;
      --muted:#a9acb4;
      --brand:#ffd166;
      --panel:#161922;
      --panel-2:#1b2030;
    }
    html,body{height:100%; margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial; display:flex; flex-direction:column;}

    header, footer{padding:16px 20px; background:linear-gradient(180deg,#171b24,#12151d); border-bottom:1px solid #232836;}
    header h1{margin:0 0 6px; font-size:clamp(20px,3.5vw,28px)}
    header p{margin:0; color:var(--muted)}

    main{flex:1; display:flex; flex-direction:column;}

    .wrap{flex:1; display:flex; flex-direction:row; height:calc(100vh - 150px);}
    .left{width:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; overflow:hidden;}
    .right{width:50%; background:var(--panel); overflow:auto;}

    .tabs{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 18px; justify-content:center;}
    .tab{appearance:none; border:1px solid #2b3142; background:#171c29; color:var(--fg); padding:10px 14px; border-radius:999px; cursor:pointer;}
    .tab[aria-selected="true"]{background:var(--panel-2); outline:2px solid var(--brand);}

    .sceneBox{width:100%; height:100%; background:#0b0e14; display:flex; align-items:center; justify-content:center;}
    .sceneBg{width:100%; height:100%; object-fit:contain; object-position:center;}

    .panel{padding:24px;}
    .title{font-size:20px; margin:0 0 8px}
    .desc{color:var(--muted); margin:0 0 12px; white-space:pre-line; font-style:italic;}
    .tags{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 10px}
    .tag{font-size:12px; padding:4px 10px; border-radius:999px; background:#1f2534; border:1px solid #2b3142; color:#d7d8dd}
    .bullets{margin:10px 0 0 18px}
    .bullets li{margin:4px 0}

    footer{border-top:1px solid #232836; color:var(--muted); text-align:center;}
  .dialSection{padding:14px 20px; background:linear-gradient(180deg,#131823,#0f131f); border-top:1px solid #232836}
    .dialWrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; align-items:center; gap:12px}
    .dial{position:relative; width:280px; height:280px; border-radius:50%; background:#111723; border:2px solid #2b3142; box-shadow:inset 0 0 40px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.25);}
    .dial-face .tick{position:absolute; left:50%; top:50%; width:2px; height:18%; background:#2e3a53; transform-origin:50% calc(100%);}
    .dial-face .t0{transform:translate(-50%,-100%) rotate(0deg);} /* вверх */
    .dial-face .t1{transform:translate(-50%,-100%) rotate(90deg);} /* право */
    .dial-face .t2{transform:translate(-50%,-100%) rotate(180deg);} /* низ */
    .dial-face .t3{transform:translate(-50%,-100%) rotate(270deg);} /* лево */
    .dial-knob{--rot:0deg; position:absolute; left:50%; top:50%; width:64px; height:64px; transform:translate(-50%,-50%) rotate(var(--rot)); border-radius:50%; background:radial-gradient(circle at 35% 35%, #2b3142, #1b2030 70%); border:2px solid #3a4158; box-shadow:0 6px 18px rgba(0,0,0,.4);}
    .dial-knob:after{content:""; position:absolute; left:50%; top:-18px; width:2px; height:18px; background:#ffd166; transform:translateX(-50%);} /* указатель */
    .dial-labels{list-style:none; margin:0; padding:0; position:absolute; inset:0;}
    .dial-label{position:absolute; transform:translate(-50%,-50%); font-size:14px; color:#d7d8dd; background:#1b2030; border:1px solid #2b3142; padding:6px 10px; border-radius:999px; cursor:pointer; user-select:none}
    .dial-label[data-mode="morning"]{left:50%; top:6%;}
    .dial-label[data-mode="day"]{left:94%; top:50%;}
    .dial-label[data-mode="evening"]{left:50%; top:94%;}
    .dial-label[data-mode="night"]{left:6%; top:50%;}
    .dial-controls{display:flex; gap:12px; align-items:center;}
    .ctrl{background:#171c29; border:1px solid #2b3142; color:#e8e8ea; padding:8px 12px; border-radius:10px}
    @media(max-width:760px){
      html,body{height:auto;min-height:100%}
      header{padding:10px 12px}header h1{font-size:20px}header p{font-size:12px}
      .tabs{gap:5px;margin:8px 6px}.tab{padding:7px 9px;font-size:12px}
      .wrap{height:auto;display:grid;grid-template-columns:1fr;}
      .left,.right{width:100%}.left{height:auto;aspect-ratio:3/2}.right{max-height:210px}
      .panel{padding:12px}.title{font-size:17px}.desc{font-size:12px;line-height:1.35}.tags,.bullets{font-size:11px}
      .dialSection{padding:9px 10px 68px}.dialWrap{gap:8px}.dial{width:185px;height:185px}
      .dial-knob{width:48px;height:48px}.dial-label{font-size:10px;padding:4px 6px}.dial-controls{gap:6px}.ctrl{padding:6px 8px;font-size:11px}
      footer{display:none}
    }
  </style>
</head>
<body>
  <header>
    <h1>Печь в жизни крестьянина — интерактивный день</h1>
    <p>Выберите время суток и посмотрите, как использовалась русская печь</p>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="Время суток">
      <button class="tab" id="tab-morning" role="tab" aria-selected="false" aria-controls="panel" data-mode="morning">🌅 Утро</button>
      <button class="tab" id="tab-day" role="tab" aria-selected="false" aria-controls="panel" data-mode="day">🌤 День</button>
      <button class="tab" id="tab-evening" role="tab" aria-selected="false" aria-controls="panel" data-mode="evening">🌆 Вечер</button>
      <button class="tab" id="tab-night" role="tab" aria-selected="false" aria-controls="panel" data-mode="night">🌙 Ночь</button>
    </div>

    <div class="wrap">
      <div class="left">
        <div class="sceneBox">
          <img id="sceneBg" class="sceneBg" alt="Анимированный фон сцены в зависимости от времени суток" />
        </div>
      </div>

      <div class="right">
        <div class="panel" id="panel" aria-live="polite">
          <h2 class="title" id="panelTitle">—</h2>
          <p class="desc" id="panelDesc">—</p>
          <div class="tags" id="panelTags"></div>
          <ul class="bullets" id="panelBullets"></ul>
        </div>
      </div>
    </div>
    <section class="dialSection" aria-label="Круговой переключатель времени суток">
      <div class="dialWrap">
        <div class="dial" id="dayDial" role="slider" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0" aria-valuetext="Утро" tabindex="0">
          <div class="dial-face">
            <span class="tick t0" aria-hidden="true"></span>
            <span class="tick t1" aria-hidden="true"></span>
            <span class="tick t2" aria-hidden="true"></span>
            <span class="tick t3" aria-hidden="true"></span>
          </div>
          <div class="dial-knob" id="dialKnob" aria-hidden="true"></div>
          <ul class="dial-labels" aria-hidden="false">
            <li class="dial-label" data-mode="morning">Утро</li>
            <li class="dial-label" data-mode="day">День</li>
            <li class="dial-label" data-mode="evening">Вечер</li>
            <li class="dial-label" data-mode="night">Ночь</li>
          </ul>
        </div>
        <div class="dial-controls">
          <label class="ctrl"><input type="checkbox" id="snapChk" checked> Защёлки по четвертям</label>
          <button type="button" id="autoBtn" aria-pressed="false" class="ctrl">Автопрокрутка</button>
        </div>
      </div>
    </section>

  </main>

  <footer>© Музей русской печи • Киоск-версия, офлайн</footer>

<script src="../shared/museum-promo.js?v=3"></script>
<script src="../shared/embed-height.js?v=3"></script>
  <script>
    const STATES = {
      morning: {
        title: 'Печь просыпается вместе с домом',
        desc: 'Ш-ш-ш... дым ползёт по устью. Я просыпаюсь — глухо, медленно. Сыплют золу, скребут, шорох, треск... огонь берётся, затягивает воздух. Пых — и загудело в трубе. Камни пьют жар, стены откликаются. Я грею, дышу, живу. Без меня холодно, без меня — тишина.',
        tags: ['растопка','готовка','сушка'],
        bullets: ['Начало дня: растапливают печь.','Готовят к обеду и начинают домашние дела.','Печь даёт первое утреннее тепло.'],
        bg: 'morning.png'
      },
      day: {
        title: 'Тепло и дела по хозяйству',
        desc: 'Эх, бывало... печь у нас — не то што теперича. Утром растопишь — к полудню ровный жар идёт, хлебушек поднимется, щи кипят, молочко паром дышит. Печь-то умная, живая. Слышишь — гудит ласково, значит, доброе пламя. А коли шипит да рычит — остуди малость. Мы всё на слух знали, не по книжке. Печь — как подруга: покормишь, приголубишь, тогда и дом добр.',
        tags: ['обогрев','готовка','игры'],
        bullets: ['Печь используется для готовки и тепла.','Дети играют, в доме оживление.','Обед к столу — день в самом разгаре.'],
        bg: 'day.png'
      },
      evening: {
        title: 'Уют и отдых',
        desc: 'Сумерки. В избе тихо, будто день вышел за порог. Печь ровно дышит, подрагивает светом. Дети едят кашу, пахнет хлебом. Старик рассказывает про летний лён, про реку. Женщина сидит ближе к устью, руки у неё красные от тепла. В каждом вдохе — усталость и покой. Огонь слушает, не мигая.',
        tags: ['подтопка','ужин','уют'],
        bullets: ['Вечерняя суета у печи.','Огонь вновь разгорается, уют наполняет избу.','Семья собирается на ужин.'],
        bg: 'evening.png'
      },
      night: {
        title: 'Отдых и здоровье',
        desc: 'Я на печке. Тут мягко и пахнет хлебом. Камни горячие, но не жгут — как будто мама обнимает. Слышу, как капает где-то... кап-кап... и мышь шуршит. Красная искорка живёт под заслонкой — глазик печки. Я ей шепчу: «Не спи, ладно?». Она не спит. Она сторожит нас всех.',
        tags: ['сон','лечение','безопасность'],
        bullets: ['Печь остывает, остаётся мягкое тепло.','Люди спят у печи, согреваясь ночью.','Тишина и покой в доме.'],
        bg: 'night.png'
      }
    };

    const TAB_ORDER = ['morning','day','evening','night'];
    const visitedStates = new Set();
    let museumShown = false;
    const els = {
      tabs: Array.from(document.querySelectorAll('.tab')),
      panelTitle: document.getElementById('panelTitle'),
      panelDesc: document.getElementById('panelDesc'),
      panelTags: document.getElementById('panelTags'),
      panelBullets: document.getElementById('panelBullets'),
      sceneBg: document.getElementById('sceneBg'),
    };

    function setBackground(state){
      const file = STATES[state].bg;
      if(file){
        els.sceneBg.src = encodeURI(file);
        els.sceneBg.style.display = 'block';
      } else {
        els.sceneBg.style.display = 'none';
      }
    }

    function renderPanel(state){
      const s = STATES[state];
      els.panelTitle.textContent = s.title;
      els.panelDesc.textContent = s.desc;
      els.panelTags.innerHTML = '';
      s.tags.forEach(t=>{const span=document.createElement('span');span.className='tag';span.textContent=t;els.panelTags.appendChild(span);});
      els.panelBullets.innerHTML = '';
      s.bullets.forEach(b=>{const li=document.createElement('li');li.textContent=b;els.panelBullets.appendChild(li);});
    }

    function selectTabByState(state){
      els.tabs.forEach(btn=>{
        const on = btn.dataset.mode===state;
        btn.setAttribute('aria-selected', on?'true':'false');
        btn.tabIndex = on?0:-1;
      });
      localStorage.setItem('stoveDayState',state);
      renderPanel(state);
      setBackground(state);
      updateDialFromState(state);
      visitedStates.add(state);
      if(visitedStates.size===TAB_ORDER.length&&!museumShown){
        museumShown=true;
        setTimeout(()=>showMuseumPromo('Вы прожили целый день рядом с русской печью!'),650);
      }
    }

    function selectNext(dir){
      const cur=localStorage.getItem('stoveDayState')||'morning';
      const idx=TAB_ORDER.indexOf(cur);
      const next=(idx+dir+TAB_ORDER.length)%TAB_ORDER.length;
      const state=TAB_ORDER[next];
      selectTabByState(state);
      const btn=document.querySelector(`.tab[data-mode="${state}"]`);
      if(btn)btn.focus();
    }

    els.tabs.forEach(btn=>{
      btn.addEventListener('click',()=>selectTabByState(btn.dataset.mode));
      btn.addEventListener('keydown',e=>{
        if(e.key==='ArrowRight'){e.preventDefault();selectNext(+1);}
        if(e.key==='ArrowLeft'){e.preventDefault();selectNext(-1);}
      });
    });

    // === КРУГОВОЙ ПЕРЕКЛЮЧАТЕЛЬ ===
    const DIAL_ORDER = ['morning','day','evening','night']; // вверх → вправо → вниз → влево
    const dial = {
      root: document.getElementById('dayDial'),
      knob: document.getElementById('dialKnob'),
      labels: Array.from(document.querySelectorAll('.dial-label')),
      snap: document.getElementById('snapChk'),
      autoBtn: document.getElementById('autoBtn'),
      autoId: null,
      idx: 0
    };

    function angleToIndex(deg){ // 0° = вверх (утро)
      const norm = (deg + 360) % 360; // 0..359
      return Math.round(norm / 90) % 4;
    }
    function indexToAngle(idx){ return (idx*90) % 360; }

    function getPointerAngle(e){
      const r = dial.root.getBoundingClientRect();
      const cx = r.left + r.width/2; const cy = r.top + r.height/2;
      const x = (e.touches? e.touches[0].clientX : e.clientX) - cx;
      const y = (e.touches? e.touches[0].clientY : e.clientY) - cy;
      const rad = Math.atan2(y, x); // -PI..PI, 0 на +X
      let deg = rad * 180/Math.PI; // -180..180 (0 на +X)
      deg = (deg + 90 + 360) % 360; // 0 на верх
      return deg;
    }

    function setKnobByIndex(idx){ dial.idx = (idx+4)%4; dial.knob.style.setProperty('--rot', indexToAngle(dial.idx)+'deg');
      dial.root.setAttribute('aria-valuenow', String(dial.idx));
      dial.root.setAttribute('aria-valuetext', STATES[DIAL_ORDER[dial.idx]].title);
    }

    function initDial(initialState){ setKnobByIndex(DIAL_ORDER.indexOf(initialState));
      // label clicks
      dial.labels.forEach(el=> el.addEventListener('click', ()=> selectTabByState(el.dataset.mode)) );
      // drag
      let dragging=false;
      const onMove=(e)=>{ if(!dragging) return; const ang=getPointerAngle(e); const idx=angleToIndex(ang);
        if(dial.snap.checked){ setKnobByIndex(idx); } else { dial.knob.style.setProperty('--rot', ang+'deg'); }
        e.preventDefault(); };
      const onUp=(e)=>{ if(!dragging) return; dragging=false; const ang=getPointerAngle(e);
        const idx=angleToIndex(ang); if(dial.snap.checked){ selectTabByState(DIAL_ORDER[idx]); } };
      dial.root.addEventListener('mousedown', e=>{ dragging=true; onMove(e); });
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      dial.root.addEventListener('touchstart', e=>{ dragging=true; onMove(e); }, {passive:false});
      window.addEventListener('touchmove', onMove, {passive:false});
      window.addEventListener('touchend', onUp);

      // keyboard
      dial.root.addEventListener('keydown', (e)=>{
        if(e.key==='ArrowRight' || e.key==='ArrowDown'){ e.preventDefault(); selectNext(+1); }
        if(e.key==='ArrowLeft'  || e.key==='ArrowUp'){   e.preventDefault(); selectNext(-1); }
      });

      // auto
      dial.autoBtn.addEventListener('click', ()=>{
        const running = dial.autoBtn.getAttribute('aria-pressed')==='true';
        if(running){ clearInterval(dial.autoId); dial.autoId=null; dial.autoBtn.setAttribute('aria-pressed','false'); dial.autoBtn.textContent='Автопрокрутка'; }
        else { dial.autoId = setInterval(()=> selectNext(+1), 3500); dial.autoBtn.setAttribute('aria-pressed','true'); dial.autoBtn.textContent='Пауза'; }
      });
    }

    function updateDialFromState(state){ setKnobByIndex(DIAL_ORDER.indexOf(state)); }

    const saved=localStorage.getItem('stoveDayState');
    const initial=saved&&STATES[saved]?saved:'morning';
    selectTabByState(initial);
    initDial(initial);

  </script>
</body>
</html>
